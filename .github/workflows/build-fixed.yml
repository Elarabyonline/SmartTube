name: Build SmartTube with pairing-code fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply MediaServiceCore PR 68 (plain-text pairing code fix)
        run: |
          cd MediaServiceCore
          git config user.email "ci@example.com"
          git config user.name "ci"
          git fetch origin pull/68/head:pr68
          git merge --no-edit pr68
          git log --oneline -3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStbetaDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-pairing-fix
          path: smarttubetv/build/outputs/apk/stbeta/debug/*.apk
          if-no-files-found: error
