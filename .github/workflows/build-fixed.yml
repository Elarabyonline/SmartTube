name: Build SmartTube with pairing-code fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply MediaServiceCore PR 68 (plain-text pairing code fix)
        run: |
          cd MediaServiceCore
          curl -fsSL https://github.com/yuliskov/MediaServiceCore/pull/68.diff -o ../pr68.diff
          cat ../pr68.diff
          git apply --check ../pr68.diff
          git apply ../pr68.diff
          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStbetaDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-pairing-fix
          path: smarttubetv/build/outputs/apk/stbeta/debug/*.apk
          if-no-files-found: error
